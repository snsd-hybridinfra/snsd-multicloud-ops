{
  "schema_version": "1.0.0",
  "package_id": "ZT-ID-001",
  "policy_version": "1.0.0",
  "evidence_schema": "schemas/zero-trust-identity-evidence.schema.json",
  "required_execution_authority": "CODEX_EXECUTED_LOCAL",
  "required_execution_mode": "SYNTHETIC_FIXTURE_VALIDATION",
  "required_target": "LOCAL_REPOSITORY_FIXTURES",
  "runtime_executed": false,
  "live_identity_changed": false,
  "status": "LOCAL_VALIDATION_ONLY",
  "retention_policy": "Retain schemas, synthetic fixtures, deterministic decisions, validator version, sanitized counts, and explicit limitations in Git.",
  "prohibited_content": [
    "REAL_USERNAMES",
    "PERSONAL_EMAIL_ADDRESSES",
    "PASSWORDS_OR_PASSWORD_HASHES",
    "TOKENS_OR_CLIENT_SECRETS",
    "PRIVATE_KEYS_OR_CERTIFICATE_PRIVATE_MATERIAL",
    "MFA_SEEDS_OR_RECOVERY_CODES",
    "FULL_PRODUCTION_ACCOUNT_EXPORTS",
    "COMPLETE_LOGIN_HISTORY",
    "RAW_RUNTIME_OUTPUT",
    "CLOUDS_YAML_CONTENT",
    "PASSWORDS_YML_CONTENT",
    "REAL_ENV_CONTENT"
  ],
  "allowed_secret_reference_schemes": [
    "env://",
    "file-ref://",
    "vault-ref://",
    "external-secret://"
  ],
  "sanitization_rules": [
    "Use synthetic labels and stable fixture identifiers.",
    "Record counts and reason codes instead of identity attributes when possible.",
    "Retain external secret references only and never dereference them.",
    "Record no runtime authentication result in P1-ID-001."
  ],
  "privacy_requirements": [
    "PURPOSE_LIMITATION",
    "MINIMUM_IDENTITY_ATTRIBUTES",
    "SYNTHETIC_FIXTURES_ONLY",
    "NO_UNNECESSARY_PERSONAL_DATA",
    "SANITIZED_EVIDENCE_ONLY",
    "NON_SENSITIVE_TARGET_LABELS"
  ],
  "limitations": [
    "Evidence supports package-local validation only.",
    "Capability runtime validation, enforcement, and maturity remain unassessed."
  ]
}
