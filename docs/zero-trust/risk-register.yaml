  "risks":[
    {"risk_id":"RISK-LOCKOUT","description":"Identity or network enforcement locks out operators.","probability":"MEDIUM","impact":"CRITICAL","trigger":"Approved recovery channel fails after enforcement.","prevention":"Independent recovery, preflight and timed rollback.","detection":"Positive operator recovery case.","response":"Stop enforcement and invoke recovery.","rollback":"Restore reviewed authentication or network backup.","owner_role":"Security operator","residual_risk":"Platform recovery may still require console access.","review_phase":"PHASE_1"},
    {"risk_id":"RISK-ADMIN-ACCESS-LOSS","description":"Administrator access is removed or over-restricted.","probability":"MEDIUM","impact":"CRITICAL","trigger":"No approved administrator can reach the target.","prevention":"Separate administrator and validator identities.","detection":"Independent administrator login test.","response":"Use break-glass recovery and freeze changes.","rollback":"Restore prior identity and authorization files.","owner_role":"Identity owner","residual_risk":"Human recovery delay remains.","review_phase":"PHASE_1"},
    {"risk_id":"RISK-DESTRUCTIVE-FIREWALL","description":"A firewall or ACL rule interrupts required traffic.","probability":"MEDIUM","impact":"CRITICAL","trigger":"Expected management or service probe fails.","prevention":"Dry run, explicit paths, out-of-band access and rollback timer.","detection":"Continuous allowed-flow probe.","response":"Abort and restore prior rules.","rollback":"Load reviewed saved ACL or firewall state.","owner_role":"Network operator","residual_risk":"Transient packet loss may occur.","review_phase":"PHASE_1"},
    {"risk_id":"RISK-STALE-EVIDENCE","description":"Evidence is stale, incomplete or detached from current configuration.","probability":"HIGH","impact":"HIGH","trigger":"Freshness threshold or source correlation fails.","prevention":"Timestamps, fingerprints and scheduled freshness checks.","detection":"Evidence-integrity validator.","response":"Invalidate decision and rerun approved validation.","rollback":"Revert unsupported status to prior state.","owner_role":"Evidence custodian","residual_risk":"External time or source outages can delay acceptance.","review_phase":"ALL"},
    {"risk_id":"RISK-STATUS-OVERCLAIM","description":"Planning or partial evidence is presented as implementation, runtime acceptance or maturity.","probability":"MEDIUM","impact":"CRITICAL","trigger":"A status lacks matching evidence authority.","prevention":"Separate status dimensions and default-deny validators.","detection":"Status truth and claim scans.","response":"Reject claim and correct the authoritative record.","rollback":"Restore last verified status snapshot.","owner_role":"Governance reviewer","residual_risk":"Narrative documents may lag until synchronized.","review_phase":"ALL"},
    {"risk_id":"RISK-SECRET-EXPOSURE","description":"Credentials, keys, tokens or recovery material enter Git or evidence.","probability":"MEDIUM","impact":"CRITICAL","trigger":"Secret scan or reviewer finds sensitive material.","prevention":"Ignored runtime, placeholders and sanitization.","detection":"Secret scan and staged-file review.","response":"Stop, remove material and rotate through owner workflow.","rollback":"Purge pending change; use authorized history remediation only if committed.","owner_role":"Security operator","residual_risk":"External copies may require separate response.","review_phase":"ALL"},
    {"risk_id":"RISK-PERSONAL-DATA","description":"Personal identifiers or behavior data are over-collected.","probability":"MEDIUM","impact":"HIGH","trigger":"Evidence contains direct identifiers beyond approved need.","prevention":"Minimization, pseudonyms and field allowlists.","detection":"Privacy scan and evidence review.","response":"Quarantine and sanitize before tracking.","rollback":"Delete untracked raw copy through approved handling.","owner_role":"Evidence custodian","residual_risk":"Correlation quality may decline after minimization.","review_phase":"PHASE_2"},
    {"risk_id":"RISK-SERVICE-INTERRUPTION","description":"Control implementation or validation interrupts service.","probability":"MEDIUM","impact":"HIGH","trigger":"Health or availability probe fails.","prevention":"Maintenance boundary, health checks and minimal changes.","detection":"Pre/post health probes.","response":"Abort, roll back and document impact.","rollback":"Restore prior known-good configuration.","owner_role":"Service owner","residual_risk":"Short interruption may still occur.","review_phase":"ALL"},
    {"risk_id":"RISK-UNSUPPORTED-GUIDANCE","description":"KISA guidance does not match the exact product or version.","probability":"MEDIUM","impact":"HIGH","trigger":"Guide method is inapplicable or unsafe for target version.","prevention":"Version, environment, impact and vendor-reference review.","detection":"Applicability assessment before change.","response":"Mark conditional or not applicable; define exception or compensating control.","rollback":"Do not apply unsupported guidance.","owner_role":"Control owner","residual_risk":"A tailored control may remain unverified.","review_phase":"ALL"},
    {"risk_id":"RISK-DUPLICATE-AUTHORITY","description":"Multiple trackers claim independent current truth.","probability":"MEDIUM","impact":"HIGH","trigger":"Machine authorities disagree.","prevention":"Declare one authority and treat Markdown as a view.","detection":"Synchronization validator.","response":"Resolve to package evidence and deprecate duplicate authority.","rollback":"Restore prior verified authority hierarchy.","owner_role":"Governance reviewer","residual_risk":"Historical files may still be misread without context.","review_phase":"PHASE_0"},
    {"risk_id":"RISK-HARDWARE-RESOURCES","description":"Central platforms exceed available CPU, memory or storage.","probability":"HIGH","impact":"HIGH","trigger":"Capacity preflight or health threshold fails.","prevention":"Sizing, quotas and staged deployment.","detection":"Resource monitoring and load test.","response":"Reduce scope or acquire approved capacity.","rollback":"Remove partial platform and restore prior services.","owner_role":"Infrastructure owner","residual_risk":"Lab scale may not represent enterprise load.","review_phase":"PHASE_2"},
