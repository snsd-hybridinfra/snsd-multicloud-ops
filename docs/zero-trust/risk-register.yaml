    {"risk_id":"RISK-AUTOMATIC-RESPONSE-DAMAGE","description":"Automated response causes lockout, isolation or data loss.","probability":"MEDIUM","impact":"CRITICAL","trigger":"Response executes without valid approval or rollback.","prevention":"Approval-first fixed handlers and non-destructive default.","detection":"Policy evaluator and negative tests.","response":"Stop handler and execute independent recovery.","rollback":"Run tested inverse action.","owner_role":"Automation approver","residual_risk":"Approved action can still have unexpected impact.","review_phase":"PHASE_4"},
