{
  "event": {
    "schema_version": "1.0",
    "event_id": "<stable-event-id>",
    "timestamp": "<source-utc-timestamp>",
    "received_timestamp": "<ingestion-utc-timestamp>",
    "source_type": "<approved-source-adapter>",
    "source_name": "<bounded-source-name>",
    "environment": "NON_PRODUCTION_LAB",
    "event_category": "<normalized-category>",
    "event_type": "<normalized-type>",
    "severity": "<INFO|LOW|MEDIUM|HIGH|CRITICAL>",
    "action": "<observed-action-or-null>",
    "outcome": "<PASS|WARN|FAIL|UNKNOWN>",
    "actor": null,
    "target": null,
    "network": null,
    "process": null,
    "authentication": null,
    "authorization": null,
    "policy": null,
    "validation": {"check": "<sanitized-check>", "result": "<outcome>"},
    "correlation": null,
    "evidence": {"authority": "<evidence-authority>"},
    "sensitivity": "SANITIZED",
    "sanitization": {"status": "APPLIED"},
    "raw_reference": "<ignored-runtime-relative-reference>"
  },
  "rules": [
    "Use UTC for event and ingestion timestamps while preserving an available source timestamp.",
    "Missing source values remain null and are never invented.",
    "Actor fields are null for system events unless an approved source supplies a sanitized identity.",
    "Tokens, secrets, private keys, credential files, complete dynamic identifiers, and raw personal activity are prohibited.",
    "Stable event identifiers are derived from sanitized content and bounded source metadata.",
    "ENDPOINT_STATE event types may be DEVICE_DISCOVERED, INVENTORY_UPDATED, COMPLIANCE_PASS, COMPLIANCE_FAIL, VULNERABILITY_DETECTED, SECURITY_UPDATE_AVAILABLE, REBOOT_REQUIRED, ENDPOINT_AGENT_HEALTHY, ENDPOINT_AGENT_UNHEALTHY, UNSUPPORTED_OPERATING_SYSTEM, STALE_ASSESSMENT, UNAUTHORIZED_DEVICE_DETECTED, PATCH_ACTION_PROPOSED, PATCH_ACTION_APPROVED, or PATCH_ACTION_COMPLETED; an event records an observation and never proves that a mutation occurred.",
    "WORKLOAD_STATE event types may be APPLICATION_DISCOVERED, WORKLOAD_DISCOVERED, WORKLOAD_STARTED, WORKLOAD_STOPPED, HEALTH_CHECK_PASS, HEALTH_CHECK_FAIL, DEPLOYMENT_VALIDATION_PASS, DEPLOYMENT_VALIDATION_FAIL, SBOM_GENERATED, SBOM_VALIDATION_FAIL, VULNERABILITY_DETECTED, SECRET_SCAN_FINDING, ARTIFACT_SIGNATURE_VERIFIED, ARTIFACT_SIGNATURE_FAILED, POLICY_GATE_PASSED, POLICY_GATE_FAILED, or WORKLOAD_DRIFT_DETECTED; no event may imply deployment, signing, or mutation without matching execution evidence.",
    "DATA_STATE event types may be DATA_ASSET_DISCOVERED, CLASSIFICATION_ASSIGNED, CLASSIFICATION_CHANGED, ACCESS_GRANTED, ACCESS_DENIED, EXPORT_DETECTED, BACKUP_STARTED, BACKUP_COMPLETED, BACKUP_FAILED, RESTORE_STARTED, RESTORE_COMPLETED, RESTORE_FAILED, INTEGRITY_CHECK_PASSED, INTEGRITY_CHECK_FAILED, DLP_FINDING_CREATED, DLP_FALSE_POSITIVE_APPROVED, ENCRYPTION_ASSESSMENT_CHANGED, STALE_BACKUP_DETECTED, or UNCLASSIFIED_DATA_DETECTED; events contain stable asset IDs and sanitized outcomes only, never values, full records, complete identifiers, tokens, keys, or file contents.",
    "SYSTEM_STATE event types may be SYSTEM_DISCOVERED, BASELINE_ASSIGNED, CONFIGURATION_MATCHED, CONFIGURATION_DRIFT_DETECTED, PRIVILEGED_ACCESS_ALLOWED, PRIVILEGED_ACCESS_DENIED, SERVICE_HEALTHY, SERVICE_DEGRADED, SERVICE_FAILED, EXPOSURE_FINDING_CREATED, UPDATE_GAP_DETECTED, RECOVERY_READINESS_CHANGED, RECOVERY_STARTED, RECOVERY_COMPLETED, or RECOVERY_FAILED; events contain stable system and control IDs plus sanitized outcomes only and never credential values, secret hashes, full configurations, complete address or port inventories, or personal workstation activity.",
    "AUTOMATION_STATE event types may be WORKFLOW_PLANNED, WORKFLOW_APPROVED, WORKFLOW_DENIED, WORKFLOW_STARTED, WORKFLOW_COMPLETED, WORKFLOW_PARTIAL, WORKFLOW_FAILED, WORKFLOW_TIMED_OUT, WORKFLOW_BLOCKED_BY_POLICY, WORKFLOW_BLOCKED_BY_APPROVAL, ACTION_STARTED, ACTION_COMPLETED, ACTION_FAILED, ACTION_SKIPPED, PROPOSAL_GENERATED, EVIDENCE_SANITIZED, EVIDENCE_VALIDATION_FAILED, CORRELATION_HANDOFF_CREATED, INCIDENT_REVIEW_CREATED, ROLLBACK_REQUIRED, ROLLBACK_COMPLETED, or STALE_LOCK_DETECTED; events contain stable catalog, plan, workflow, action, and execution identifiers plus sanitized outcomes only, never environment secrets, command-line secrets, approval credentials, raw command output, tokens, private keys, or personal identity details."
  ]
}
